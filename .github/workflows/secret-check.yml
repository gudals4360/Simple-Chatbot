# GitHub에 올라온 코드에 API 키가 있는지 검사한다.
# 웹에서 파일을 직접 올린 경우에도 동작하고, 키가 보이면 빨간 X와 함께 이메일 알림이 간다.
name: API 키 검사

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API 키가 있는지 검사
        run: python .github/scripts/check_secrets.py
